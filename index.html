<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Birds of War: private preview</title>
<style>
:root{--bg:#0b1426;--card:#13213b;--ink:#eef3ff;--dim:#9fb0cf;--gold:#e8b34a;--red:#c8202c}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:radial-gradient(1200px 600px at 50% -200px,#1d3561 0,var(--bg) 70%) fixed}
#lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#lock h1{font-size:28px;margin:0 0 4px;letter-spacing:.06em}#lock p{color:var(--dim);margin:0 0 22px}
#lock form{display:flex;gap:8px}#pw{width:150px;font-size:22px;padding:12px;border-radius:12px;border:1px solid #2c4372;background:#0f1b32;color:var(--ink);text-align:center;letter-spacing:.3em}
button{font:inherit;font-weight:700;padding:12px 18px;border:0;border-radius:12px;background:var(--gold);color:#2a1a00}
#err{color:#ff8a8a;min-height:1.4em;margin-top:12px}
#app{display:none;max-width:760px;margin:0 auto;padding:16px 14px 110px}
header{text-align:center;padding:18px 0 8px}header h1{margin:0;font-size:30px;letter-spacing:.08em}header h1 b{color:var(--red)}
header p{color:var(--dim);margin:6px 0 0;font-size:14px}
nav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:10px 0;background:linear-gradient(var(--bg) 80%,transparent)}
nav a{flex:none;color:var(--ink);text-decoration:none;font-size:14px;padding:7px 12px;border-radius:99px;background:#1a2c4e}
h2{margin:26px 4px 10px;font-size:20px;color:var(--gold)}
.card{background:var(--card);border-radius:16px;padding:14px;margin:0 0 14px;box-shadow:0 2px 12px #0006}
.card h3{margin:0 0 4px;font-size:18px}.card p{margin:0 0 10px;color:var(--dim);font-size:15px}
.m{display:flex;flex-direction:column;gap:10px}
.m img,.m video{width:100%;border-radius:10px;background:#0a1220;display:block;min-height:120px}
.m video.tall{max-height:78vh;width:auto;max-width:100%;margin:0 auto}
.m audio{width:100%}.soon{font-size:13px;color:var(--gold)}
.cm{width:100%;margin-top:10px;min-height:44px;font:inherit;font-size:15px;color:var(--ink);background:#0f1b32;border:1px solid #2c4372;border-radius:10px;padding:9px}
.cm:not(:placeholder-shown){border-color:var(--gold)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;gap:8px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#0b1426ee;border-top:1px solid #22375f;backdrop-filter:blur(6px)}
#bar input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid #2c4372;background:#0f1b32;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1f6b3a;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:10;max-width:90vw;text-align:center}
.hint{color:var(--dim);font-size:13px;text-align:center;margin:4px 0 0}
footer{color:var(--dim);font-size:12px;text-align:center;margin-top:30px}
</style></head><body>

async function derive(pw){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt'])}
const dec=(buf)=>crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},KEY,buf.slice(12));
async function unlock(pw){KEY=await derive(pw);const w=JSON.parse(new TextDecoder().decode(await dec(b64(BLOB))));document.getElementById('ttl').innerHTML=w.title;document.title=w.doc;FB=w.fb||null;render(w.sections)}
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function render(man){document.getElementById('lock').remove();document.getElementById('app').style.display='block';
 const nav=document.getElementById('nav'),main=document.getElementById('main');
 man.forEach((s,i)=>{nav.insertAdjacentHTML('beforeend',`<a href="#s${i}">${esc(s.name)}</a>`);
  let h=`<h2 id="s${i}">${esc(s.name)}</h2>`;
  for(const it of s.items){h+=`<div class="card"><h3>${esc(it.title)}</h3><p>${esc(it.blurb)}</p><div class="m">`;
   if(!it.media.length)h+='<div class="soon">Footage coming soon</div>';
   for(const m of it.media)h+=`<div data-f="${m.f}" data-k="${m.k}" data-t="${m.t}"></div>`;h+=`</div><textarea class="cm" rows="1" placeholder="Comment (optional)" data-id="${esc(it.id)}" data-title="${esc(it.title)}"></textarea></div>`}
  main.insertAdjacentHTML('beforeend',h)});
 const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);load(e.target)}}),{rootMargin:'600px'});
 document.querySelectorAll('[data-f]').forEach(el=>io.observe(el));setupComments()}
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(_){}};
function boxes(){return [...document.querySelectorAll('.cm')]}
function count(){const n=boxes().filter(b=>b.value.trim()).length;document.getElementById('send').textContent=n?`Send ${n} comment${n>1?'s':''}`:'Send comments'}
function toast(m,ms){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms||3500)}
function setupComments(){document.getElementById('bar').style.display='flex';const who=document.getElementById('who');who.value=LS('bowxm_who')||'';who.oninput=()=>LS('bowxm_who',who.value);
 const saved=JSON.parse(LS('bowxm_draft')||'{}');
 for(const b of boxes()){b.value=saved[b.dataset.id]||'';b.oninput=()=>{const d=JSON.parse(LS('bowxm_draft')||'{}');if(b.value.trim())d[b.dataset.id]=b.value;else delete d[b.dataset.id];LS('bowxm_draft',JSON.stringify(d));b.style.height='auto';b.style.height=b.scrollHeight+'px';count()}}
 count();document.getElementById('send').onclick=send}
function clearAll(){for(const b of boxes()){b.value='';b.style.height=''}LS('bowxm_draft',null);count()}
async function send(){const items=boxes().filter(b=>b.value.trim()).map(b=>({id:b.dataset.id,title:b.dataset.title,comment:b.value.trim().slice(0,2000)}));
 if(!items.length){toast('Nothing to send. Blank means looks good.');return}
 const who=document.getElementById('who').value.trim().slice(0,60);const btn=document.getElementById('send');btn.disabled=true;btn.textContent='Sending...';
 try{if(!FB)throw 0;const r=await fetch(FB.url+'/rest/v1/'+FB.table,{method:'POST',headers:{'apikey':FB.key,'Authorization':'Bearer '+FB.key,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({reviewer:who,items})});
  if(!r.ok)throw r.status;clearAll();toast('Sent. Thanks!')}
 catch(_){const head='Preview comments'+(who?' from '+who:'');const lines=items.map(i=>`${i.id} ${i.title}: ${i.comment}`);
  const parts=[];let cur='';for(let l of lines){while(l.length>1200){parts.push(cur);cur='';parts.push(l.slice(0,1200));l=l.slice(1200)}
   if(cur&&(cur.length+l.length+1)>1200){parts.push(cur);cur=''}cur+=(cur?'\n':'')+l}if(cur)parts.push(cur);
  const P=parts.filter(Boolean);window._tgParts=P.map((t,i)=>head+(P.length>1?` (part ${i+1}/${P.length})`:'')+':\n'+t);window._tgIdx=0;sendPart();return}
 finally{btn.disabled=false;count()}}
function sendPart(){const P=window._tgParts,i=window._tgIdx,btn=document.getElementById('send');
 window.open('https://t.me/share/url?url='+encodeURIComponent(location.href.split('#')[0])+'&text='+encodeURIComponent(P[i]),'_blank');
 window._tgIdx=i+1;
 if(window._tgIdx<P.length){setTimeout(()=>{btn.disabled=false;btn.textContent=`Send part ${window._tgIdx+1}/${P.length}`;btn.onclick=sendPart;toast(`Part ${i+1}/${P.length} opened in Telegram. Send it, come back, tap the button for the next part.`,6000)},300)}
 else setTimeout(()=>{btn.onclick=send;if(confirm(P.length>1?`All ${P.length} parts opened in Telegram. Did you send them all? Tap OK to clear the boxes.`:'Telegram opened with your comments. Did you send them? Tap OK to clear the boxes.'))clearAll();count()},1500)}
async function load(el){try{const r=await fetch('d/'+el.dataset.f);const buf=new Uint8Array(await r.arrayBuffer());
 const url=URL.createObjectURL(new Blob([await dec(buf)],{type:el.dataset.t}));let x;
 if(el.dataset.k==='img'){x=new Image();x.loading='lazy';x.alt=''}
 else if(el.dataset.k==='video'){x=document.createElement('video');x.controls=x.muted=x.loop=x.playsInline=true;x.preload='metadata';
  x.onloadedmetadata=()=>{if(x.videoHeight>x.videoWidth)x.classList.add('tall')}}
 else{x=document.createElement('audio');x.controls=true;x.preload='none'}
 x.src=url;el.replaceWith(x)}catch(e){el.textContent='(could not load)'}}
